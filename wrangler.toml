name = "ghl-mcp"
main = "src/index.js"
compatibility_date = "2026-03-02"

# Send logs to the Cloudflare dashboard (Workers > your Worker > Logs).
[observability]
enabled = true

# Create the database in YOUR account first:
#   wrangler d1 create ghl-mcp-accounts
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "ghl-mcp-accounts"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Never stored in this file. Set each one with `wrangler secret put <NAME>`.
#
#   MCP_AUTH_TOKEN       Bearer token for /mcp and /api/accounts
#                        openssl rand -hex 32
#   MASTER_KEY           AES-256 key for API keys stored in D1. MUST be base64.
#                        openssl rand -base64 32
#   ACCESS_TEAM_DOMAIN   Zero Trust team name, the part before
#                        .cloudflareaccess.com (e.g. "acme")
#   ACCESS_AUD           Application Audience (AUD) tag of the Access app
#                        protecting /admin
#
# Optional fallback (used only when no D1 account row is configured):
#   GHL_API_KEY
#   GHL_LOCATION_ID
#
# Optional override:
#   OAUTH_REDIRECT_ORIGINS  Comma-separated origins allowed as an OAuth
#                           redirect target. Defaults to
#                           https://claude.ai,https://claude.com
#
# The Cloudflare account is chosen at deploy time, not here:
#   export CLOUDFLARE_ACCOUNT_ID=<account id from `wrangler whoami`>
